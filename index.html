<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장지휘관 훈련 플랫폼 v1</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            border-bottom: 2px solid var(--primary-red);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary-red); }

        /* 탭 스타일 */
        .tabs {
            display: flex;
            width: 100%;
            max-width: 800px;
            gap: 5px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
        }
        .tab.active {
            background: var(--primary-red);
            color: white;
            border-color: var(--primary-red);
        }

        /* 훈련 콘텐츠 */
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 마이크 모양 버튼 */
        .mic-btn {
            font-size: 4rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .mic-btn.recording {
            color: var(--primary-red);
            text-shadow: 0 0 15px rgba(211, 47, 47, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 텍스트 박스 */
        .stt-box {
            width: 100%;
            height: 200px;
            background: #000;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            color: #00ff00; /* 터미널 느낌의 녹색 텍스트 */
            font-family: 'Courier New', Courier, monospace;
            text-align: left;
            overflow-y: auto;
            box-sizing: border-box;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>현장지휘관 훈련 플랫폼 v1</h1>
    </header>

    <nav class="tabs">
        <div class="tab active">무전 훈련</div>
    </nav>

    <div class="container">
        <button id="micBtn" class="mic-btn" title="한번 클릭: 녹음, 두번 클릭: 정지">
            🎤
        </button>
        <div id="recordingStatus" style="margin-bottom: 10px; font-weight: bold; height: 20px;"></div>

        <div id="sttResult" class="stt-box" placeholder="무전 내용이 여기에 표시됩니다."></div>
        
        <p class="status-msg">마이크를 클릭하여 무전 보고를 시작하세요.</p>

        <div class="footer-note">
            (시범 운영중) - 현장지휘관 무전 교육용 프로토타입
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const sttResult = document.getElementById('sttResult');
        const statusMsg = document.getElementById('recordingStatus');

        // Web Speech API 설정
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.interimResults = true;
        recognition.lang = 'ko-KR';
        recognition.continuous = true;

        let isRecording = false;

        recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
                .map(result => result[0])
                .map(result => result.transcript)
                .join('');
            
            sttResult.innerText = transcript;
            sttResult.scrollTop = sttResult.scrollHeight;
        };

        // 클릭 로직 처리 (싱글/더블 클릭 구분)
        let clickTimer;
        micBtn.addEventListener('click', () => {
            if (clickTimer) {
                // 더블 클릭 발생: 정지
                clearTimeout(clickTimer);
                clickTimer = null;
                stopRecording();
            } else {
                clickTimer = setTimeout(() => {
                    // 싱글 클릭 발생: 녹음 시작
                    clickTimer = null;
                    if (!isRecording) startRecording();
                }, 250);
            }
        });

        function startRecording() {
            isRecording = true;
            micBtn.classList.add('recording');
            statusMsg.innerText = "● 녹음 중...";
            statusMsg.style.color = "#d32f2f";
            recognition.start();
            console.log("녹음 시작");
        }

        function stopRecording() {
            isRecording = false;
            micBtn.classList.remove('recording');
            statusMsg.innerText = "정지됨";
            statusMsg.style.color = "#888";
            recognition.stop();
            console.log("녹음 정지");
        }

        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            stopRecording();
        };
    </script>
</body>
</html>
