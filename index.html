<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록 채팅 포털</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Gowun+Dodum&display=swap');

:root {
  --bg:        #EEF2F7;
  --chat-bg:   #FFFFFF;
  --header-bg: #FFFFFF;
  --my-bubble: #4A86CF;
  --my-text:   #FFFFFF;
  --other-bubble: #FFFFFF;
  --other-text: #2D3748;
  --input-bg:  #FFFFFF;
  --border:    #E2E8F0;
  --accent:    #4A86CF;
  --accent2:   #3A6FBB;
  --muted:     #9AABB8;
  --time-color:#A0AEC0;
  --date-bg:   rgba(0,0,0,0.06);
  --sans:      'Noto Sans KR', sans-serif;
  --title:     'Gowun Dodum', 'Noto Sans KR', sans-serif;
  --shadow:    0 2px 12px rgba(74,134,207,0.10);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--other-text);
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 680px;
  margin: 0 auto;
  background: var(--chat-bg);
  box-shadow: 0 0 40px rgba(0,0,0,0.08);
  position: relative;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 20;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow-sm);
}

.header-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4A86CF, #7BB3F0);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(74,134,207,0.3);
}

.header-info { flex: 1; }

.header-name {
  font-family: var(--title);
  font-size: 15px;
  font-weight: 600;
  color: #2D3748;
  display: flex;
  align-items: center;
  gap: 6px;
}

.online-dot {
  width: 7px; height: 7px;
  background: #48BB78;
  border-radius: 50%;
  display: inline-block;
  animation: pulse-green 2s infinite;
}

@keyframes pulse-green {
  0%,100% { box-shadow: 0 0 0 0 rgba(72,187,120,0.4); }
  50%      { box-shadow: 0 0 0 4px rgba(72,187,120,0); }
}

.header-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}

.header-actions { display: flex; gap: 8px; }

.icon-btn {
  width: 36px; height: 36px;
  border: none;
  background: var(--bg);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  color: #556080;
}
.icon-btn:hover { background: #dde8f5; transform: scale(1.05); }
.icon-btn:active { transform: scale(0.95); }

/* ── Chat Area ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--bg);
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: #CBD5E0; border-radius: 4px; }

/* ── Date Divider ── */
.date-divider {
  display: flex; align-items: center; justify-content: center;
  margin: 16px 0 10px;
}

.date-divider span {
  background: var(--date-bg);
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}

/* ── Message Row ── */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin-bottom: 4px;
  animation: fadeUp 0.25s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-row.me { flex-direction: row-reverse; }

/* Avatar */
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #B794F4, #9F7AEA);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  align-self: flex-start;
  box-shadow: var(--shadow-sm);
}

.msg-row.me .avatar { display: none; }

/* Bubble group */
.bubble-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: 72%;
}

.msg-row.me .bubble-group { align-items: flex-end; }

.sender-name {
  font-size: 11px;
  font-weight: 600;
  color: #64748B;
  margin-bottom: 2px;
  margin-left: 2px;
}
.msg-row.me .sender-name { display: none; }

/* Bubble */
.bubble {
  position: relative;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.55;
  word-break: break-word;
  white-space: pre-wrap;
  box-shadow: var(--shadow-sm);
  max-width: 100%;
}

.msg-row.me .bubble {
  background: var(--my-bubble);
  color: var(--my-text);
  border-bottom-right-radius: 5px;
}

.msg-row.other .bubble {
  background: var(--other-bubble);
  color: var(--other-text);
  border-bottom-left-radius: 5px;
}

/* Image bubble */
.bubble.image-bubble {
  padding: 5px;
  background: transparent;
  box-shadow: none;
}

.bubble-img {
  width: 100%;
  max-width: 260px;
  border-radius: 14px;
  display: block;
  cursor: zoom-in;
  box-shadow: 0 2px 16px rgba(0,0,0,0.12);
  transition: transform 0.15s, box-shadow 0.15s;
  object-fit: cover;
}

.bubble-img:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}

/* Time + unread */
.meta-row {
  display: flex;
  align-items: flex-end;
  gap: 5px;
}
.msg-row.me .meta-row { flex-direction: row-reverse; }

.msg-time {
  font-size: 10px;
  color: var(--time-color);
  white-space: nowrap;
  padding-bottom: 2px;
}

/* ── Paste Hint ── */
.paste-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex: 1;
  padding: 40px;
  text-align: center;
  color: var(--muted);
  user-select: none;
}

.paste-hint .hint-icon { font-size: 52px; opacity: 0.4; }
.paste-hint .hint-title { font-size: 16px; font-weight: 600; color: #94A3B8; }
.paste-hint .hint-sub { font-size: 13px; color: var(--muted); line-height: 1.7; }
.paste-hint .hint-key {
  display: inline-block;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 2px 9px;
  font-size: 12px;
  font-weight: 600;
  color: #556080;
  box-shadow: 0 2px 0 var(--border);
}

/* ── Input Bar ── */
.input-bar {
  background: var(--input-bg);
  border-top: 1px solid var(--border);
  padding: 10px 14px 12px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
}

.input-extras {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  padding-bottom: 4px;
}

.input-extra-btn {
  width: 32px; height: 32px;
  border: none;
  background: transparent;
  font-size: 20px;
  cursor: pointer;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  color: #718096;
}
.input-extra-btn:hover { background: var(--bg); }

.input-wrap {
  flex: 1;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 8px 14px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent); }

.text-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--sans);
  font-size: 14px;
  color: #2D3748;
  resize: none;
  max-height: 120px;
  min-height: 20px;
  line-height: 1.5;
}
.text-input::placeholder { color: var(--muted); }

.send-btn {
  width: 38px; height: 38px;
  border: none;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
  box-shadow: 0 2px 8px rgba(74,134,207,0.35);
}
.send-btn:hover { background: var(--accent2); transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

/* ── Image Preview Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-box {
  position: relative;
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  max-width: min(90vw, 720px);
  max-height: 90vh;
  box-shadow: 0 24px 80px rgba(0,0,0,0.35);
  transform: scale(0.92);
  transition: transform 0.2s;
  display: flex;
  flex-direction: column;
}
.modal-overlay.open .modal-box { transform: scale(1); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: #FAFAFA;
}

.modal-title {
  font-size: 14px;
  font-weight: 600;
  color: #2D3748;
}

.modal-actions { display: flex; gap: 8px; }

.modal-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border-radius: 20px;
  border: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.modal-btn.download {
  background: var(--accent);
  color: white;
  box-shadow: 0 2px 8px rgba(74,134,207,0.3);
}
.modal-btn.download:hover { background: var(--accent2); }
.modal-btn.close {
  background: var(--bg);
  color: #556080;
}
.modal-btn.close:hover { background: #dde8f5; }

.modal-img-wrap {
  overflow: auto;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #F7F9FC;
}

.modal-img {
  max-width: 100%;
  max-height: calc(90vh - 100px);
  border-radius: 10px;
  object-fit: contain;
  display: block;
  box-shadow: 0 4px 24px rgba(0,0,0,0.1);
}

/* ── File input hidden ── */
#file-input { display: none; }

/* ── Paste-over zone ── */
.paste-zone-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(74,134,207,0.12);
  border: 4px dashed var(--accent);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.paste-zone-overlay.show { opacity: 1; }
.paste-zone-overlay span {
  background: white;
  padding: 16px 32px;
  border-radius: 40px;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  box-shadow: var(--shadow);
}

/* ── Tooltip ── */
.tooltip {
  position: fixed;
  bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(45,55,72,0.9);
  color: white;
  font-size: 12px;
  padding: 7px 16px;
  border-radius: 20px;
  pointer-events: none;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.tooltip.show { opacity: 1; }

</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-avatar">📝</div>
    <div class="header-info">
      <div class="header-name">
        나의 기록장
        <span class="online-dot"></span>
      </div>
      <div class="header-sub">텍스트와 이미지를 자유롭게 기록하세요</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnSave" title="대화 내보내기 (HTML)">💾</button>
      <button class="icon-btn" id="btnClear" title="전체 지우기">🗑️</button>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="paste-hint" id="emptyHint">
      <div class="hint-icon">💬</div>
      <div class="hint-title">기록을 시작하세요</div>
      <div class="hint-sub">
        텍스트를 입력하거나<br>
        <span class="hint-key">Ctrl</span> + <span class="hint-key">V</span> 로 이미지를 붙여넣어 기록하세요
      </div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-extras">
      <button class="input-extra-btn" id="btnImg" title="이미지 첨부">🖼️</button>
    </div>
    <div class="input-wrap">
      <textarea class="text-input" id="textInput" placeholder="기록할 내용을 입력하세요…" rows="1"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" title="전송 (Enter)">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<!-- Image Preview Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">이미지 미리보기</div>
      <div class="modal-actions">
        <button class="modal-btn download" id="btnModalDownload">⬇ 다운로드</button>
        <button class="modal-btn close" id="btnModalClose">✕ 닫기</button>
      </div>
    </div>
    <div class="modal-img-wrap">
      <img class="modal-img" id="modalImg" src="" alt="미리보기">
    </div>
  </div>
</div>

<!-- Drag overlay -->
<div class="paste-zone-overlay" id="pasteOverlay">
  <span>📎 이미지를 놓으세요</span>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<!-- File input -->
<input type="file" id="file-input" accept="image/*" multiple>

<script>
const chatArea     = document.getElementById('chatArea');
const textInput    = document.getElementById('textInput');
const sendBtn      = document.getElementById('sendBtn');
const emptyHint    = document.getElementById('emptyHint');
const modalOverlay = document.getElementById('modalOverlay');
const modalImg     = document.getElementById('modalImg');
const modalTitle   = document.getElementById('modalTitle');
const btnModalDown = document.getElementById('btnModalDownload');
const btnModalClose= document.getElementById('btnModalClose');
const btnImg       = document.getElementById('btnImg');
const fileInput    = document.getElementById('file-input');
const btnSave      = document.getElementById('btnSave');
const btnClear     = document.getElementById('btnClear');
const pasteOverlay = document.getElementById('pasteOverlay');
const tooltip      = document.getElementById('tooltip');

let msgCount = 0;
let currentImgSrc = null;
let currentImgName = 'image.png';
let lastDate = null;

/* ── Helpers ── */
function now() {
  const d = new Date();
  return d.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', hour12:true });
}

function today() {
  const d = new Date();
  return d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

function showTooltip(msg, duration=2000) {
  tooltip.textContent = msg;
  tooltip.classList.add('show');
  setTimeout(() => tooltip.classList.remove('show'), duration);
}

function removeHint() {
  if (emptyHint && emptyHint.parentNode) emptyHint.remove();
}

function insertDateDivider() {
  const todayStr = today();
  if (lastDate === todayStr) return;
  lastDate = todayStr;
  const div = document.createElement('div');
  div.className = 'date-divider';
  div.innerHTML = `<span>${todayStr}</span>`;
  chatArea.appendChild(div);
}

function scrollBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

/* ── Append Text Message ── */
function appendText(text) {
  if (!text.trim()) return;
  removeHint();
  insertDateDivider();
  msgCount++;

  const row = document.createElement('div');
  row.className = 'msg-row me';

  row.innerHTML = `
    <div class="bubble-group">
      <div class="meta-row">
        <div class="msg-time">${now()}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>
    </div>
  `;

  chatArea.appendChild(row);
  scrollBottom();
}

/* ── Append Image Message ── */
function appendImage(src, name) {
  removeHint();
  insertDateDivider();
  msgCount++;

  const row = document.createElement('div');
  row.className = 'msg-row me';

  const img = document.createElement('img');
  img.className = 'bubble-img';
  img.src = src;
  img.alt = name || '이미지';
  img.title = '클릭하여 미리보기';
  img.dataset.src  = src;
  img.dataset.name = name || 'image.png';

  img.addEventListener('click', () => openModal(src, name));

  const metaRow = document.createElement('div');
  metaRow.className = 'meta-row';

  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time';
  timeEl.textContent = now();

  const imgBubble = document.createElement('div');
  imgBubble.className = 'bubble image-bubble';
  imgBubble.appendChild(img);

  metaRow.appendChild(timeEl);
  metaRow.appendChild(imgBubble);

  const group = document.createElement('div');
  group.className = 'bubble-group';
  group.appendChild(metaRow);

  row.appendChild(group);
  chatArea.appendChild(row);
  scrollBottom();
}

/* ── Escape HTML ── */
function escapeHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ── Read File → base64 ── */
function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ── Handle image file ── */
async function handleImageFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    showTooltip('⚠ 이미지 파일만 지원됩니다'); return;
  }
  const src = await readFileAsDataURL(file);
  appendImage(src, file.name || 'image.png');
}

/* ── Send text ── */
function sendText() {
  const t = textInput.value;
  if (!t.trim()) return;
  appendText(t);
  textInput.value = '';
  textInput.style.height = 'auto';
}

sendBtn.addEventListener('click', sendText);

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

/* Auto resize textarea */
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

/* ── Paste (Ctrl+V) ── */
document.addEventListener('paste', async (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;

  let hasImage = false;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      hasImage = true;
      const file = item.getAsFile();
      await handleImageFile(file);
    }
  }

  // if text is pasted and input not focused, put into input
  if (!hasImage && document.activeElement !== textInput) {
    const text = e.clipboardData.getData('text');
    if (text) { textInput.value += text; textInput.focus(); }
  }
});

/* ── File Upload Button ── */
btnImg.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async e => {
  for (const f of e.target.files) await handleImageFile(f);
  fileInput.value = '';
});

/* ── Drag & Drop ── */
let dragCounter = 0;

document.addEventListener('dragenter', e => {
  if ([...e.dataTransfer.types].includes('Files')) {
    dragCounter++;
    pasteOverlay.classList.add('show');
  }
});

document.addEventListener('dragleave', () => {
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; pasteOverlay.classList.remove('show'); }
});

document.addEventListener('dragover', e => e.preventDefault());

document.addEventListener('drop', async e => {
  e.preventDefault();
  dragCounter = 0;
  pasteOverlay.classList.remove('show');
  for (const f of e.dataTransfer.files) await handleImageFile(f);
});

/* ── Modal ── */
function openModal(src, name) {
  currentImgSrc  = src;
  currentImgName = name || 'image.png';
  modalImg.src   = src;
  modalTitle.textContent = currentImgName;
  modalOverlay.classList.add('open');
}

function closeModal() {
  modalOverlay.classList.remove('open');
  setTimeout(() => { modalImg.src = ''; }, 200);
}

btnModalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ── Download from Modal ── */
btnModalDown.addEventListener('click', () => {
  if (!currentImgSrc) return;
  const a = document.createElement('a');
  a.href = currentImgSrc;
  a.download = currentImgName;
  a.click();
  showTooltip('⬇ 다운로드 시작');
});

/* ── Save Chat as HTML ── */
btnSave.addEventListener('click', () => {
  const rows = chatArea.innerHTML;
  const html = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기록 내보내기 — ${today()}</title>
<style>
body { font-family: 'Noto Sans KR', sans-serif; background:#EEF2F7; padding: 24px; max-width: 680px; margin: 0 auto; }
.date-divider { text-align:center; margin: 20px 0 10px; }
.date-divider span { background:rgba(0,0,0,0.06); color:#9AABB8; font-size:11px; padding:4px 14px; border-radius:20px; }
.msg-row { display:flex; align-items:flex-end; gap:6px; margin-bottom:6px; }
.msg-row.me { flex-direction:row-reverse; }
.bubble-group { display:flex; flex-direction:column; gap:3px; max-width:72%; }
.msg-row.me .bubble-group { align-items:flex-end; }
.meta-row { display:flex; align-items:flex-end; gap:5px; }
.msg-row.me .meta-row { flex-direction:row-reverse; }
.bubble { padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
.msg-row.me .bubble { background:#4A86CF; color:#fff; border-bottom-right-radius:5px; }
.bubble.image-bubble { padding:5px; background:transparent; }
.bubble-img { max-width:260px; border-radius:14px; display:block; box-shadow:0 2px 16px rgba(0,0,0,.12); }
.msg-time { font-size:10px; color:#A0AEC0; white-space:nowrap; padding-bottom:2px; }
.paste-hint { display:none; }
</style>
</head>
<body>
${rows}
<p style="text-align:center;font-size:11px;color:#9AABB8;margin-top:32px;">내보내기: ${new Date().toLocaleString('ko-KR')}</p>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `기록_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  showTooltip('💾 HTML 파일로 저장됐습니다');
});

/* ── Clear ── */
btnClear.addEventListener('click', () => {
  if (msgCount === 0) return;
  if (!confirm('모든 기록을 지우시겠습니까?')) return;
  chatArea.innerHTML = '';
  msgCount = 0;
  lastDate = null;

  const hint = document.createElement('div');
  hint.className = 'paste-hint';
  hint.id = 'emptyHint';
  hint.innerHTML = `
    <div class="hint-icon">💬</div>
    <div class="hint-title">기록을 시작하세요</div>
    <div class="hint-sub">
      텍스트를 입력하거나<br>
      <span class="hint-key">Ctrl</span> + <span class="hint-key">V</span> 로 이미지를 붙여넣어 기록하세요
    </div>
  `;
  chatArea.appendChild(hint);
  showTooltip('🗑 전체 기록이 삭제됐습니다');
});

</script>
</body>
</html>
