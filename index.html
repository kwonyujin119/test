<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>완도 화재 디브리핑 — 현장지휘관 단기 실무반 V.26.4.1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b;--accent2:#8e2b20;--navy:#0d1b3e;--navy2:#162447;--navy3:#1f3370;
  --gold:#d4a017;--green:#1a6b3a;--green2:#0f4724;--amber:#e67e22;--blue:#1a5276;
  --white:#fff;--bg:#eef2f8;--bg2:#f7f9fc;--border:#d0d9ec;--muted:#7a8aaa;
  --text:#0d1b3e;--text2:#334466;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* ═══ HEADER ═══ */
.hdr{
  background:
    radial-gradient(ellipse at 0% 100%,rgba(192,57,43,.32) 0%,transparent 50%),
    repeating-linear-gradient(0deg,transparent,transparent 32px,rgba(255,255,255,.025) 32px,rgba(255,255,255,.025) 33px),
    repeating-linear-gradient(90deg,transparent,transparent 32px,rgba(255,255,255,.025) 32px,rgba(255,255,255,.025) 33px),
    linear-gradient(135deg,#0d1b3e 0%,#162447 60%,#1a1e3a 100%);
  border-bottom:3px solid var(--gold);
  padding:18px 32px;
  display:flex;align-items:center;gap:22px;
  box-shadow:0 3px 20px rgba(13,27,62,.6)
}
.hdr-icon{
  width:68px;height:68px;flex-shrink:0;border-radius:50%;
  background:rgba(255,255,255,.07);border:2px solid rgba(212,160,23,.4);
  display:flex;align-items:center;justify-content:center
}
.hdr-icon span{font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:1px}
.hdr-title{flex:1}
.hdr-title h1{font-size:26px;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.hdr-title h1 .ver{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);margin-left:12px;font-weight:500;letter-spacing:1px;padding:3px 9px;background:rgba(212,160,23,.15);border:1px solid rgba(212,160,23,.35);border-radius:3px;vertical-align:middle}
.hdr-title p{font-size:12px;color:#9fb4d8;margin-top:5px;letter-spacing:.5px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hdr-memo{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;
  color:#c99;padding:4px 10px;background:rgba(192,57,43,.18);
  border:1px solid rgba(192,57,43,.35);border-radius:2px
}
.hdr-clock{font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:#fff;letter-spacing:1px}
.hdr-date{font-family:'DM Mono',monospace;font-size:9px;color:#7a9acc;letter-spacing:1px}

/* ═══ TAB NAV ═══ */
.tabnav{
  background:var(--navy2);
  display:grid;grid-template-columns:repeat(4,1fr);
  border-bottom:3px solid var(--gold)
}
.tab{
  background:var(--navy2);border:none;
  border-right:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.55);
  font-family:'Noto Sans KR',sans-serif;
  font-weight:700;padding:18px 14px;cursor:pointer;position:relative;
  transition:background .2s,color .2s;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px
}
.tab:last-child{border-right:none}
.tab .tn{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:3px}
.tab .tt{font-size:14px}
.tab .ts{font-size:10.5px;color:rgba(255,255,255,.4);font-weight:400;letter-spacing:.3px}
.tab::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transition:transform .3s}
.tab:hover{background:var(--navy3);color:rgba(255,255,255,.9)}
.tab:hover .tn{color:rgba(212,160,23,.6)}
.tab.active{background:var(--navy3);color:#fff}
.tab.active .tn{color:var(--gold)}
.tab.active .ts{color:#9fb4d8}
.tab.active::after{transform:scaleX(1)}
