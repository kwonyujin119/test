<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 송수신 포털</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg:       #0b0c0e;
    --surface:  #111318;
    --panel:    #161a22;
    --border:   #252b38;
    --amber:    #f5a623;
    --amber2:   #ffcc66;
    --green:    #3dffa0;
    --red:      #ff5252;
    --text:     #c8d0e0;
    --muted:    #4a5568;
    --mono:     'Share Tech Mono', monospace;
    --sans:     'Noto Sans KR', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(245,166,35,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,166,35,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Scanline */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
  }

  .wrapper {
    position: relative; z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  /* ─── Header ─── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 12px var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 6px var(--amber); opacity: 1; }
    50%      { box-shadow: 0 0 20px var(--amber); opacity: 0.7; }
  }

  .header-text h1 {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--amber);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-text p {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 1px;
    margin-top: 3px;
  }

  .status-badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    border: 1px solid rgba(61,255,160,0.3);
    padding: 4px 12px;
    letter-spacing: 2px;
    animation: blink 3s step-end infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  /* ─── Upload Zone ─── */
  .drop-zone {
    position: relative;
    border: 2px dashed var(--border);
    border-radius: 2px;
    background: var(--surface);
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
  }

  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--amber);
    background: rgba(245,166,35,0.04);
  }

  .drop-zone.has-image {
    border-color: var(--green);
    border-style: solid;
  }

  .drop-zone .corner {
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--amber);
    border-style: solid;
    opacity: 0.5;
  }
  .drop-zone .corner.tl { top: 8px; left: 8px;  border-width: 2px 0 0 2px; }
  .drop-zone .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .drop-zone .corner.bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; }
  .drop-zone .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .drop-icon {
    font-size: 40px;
    opacity: 0.3;
    transition: opacity 0.2s, transform 0.2s;
  }
  .drop-zone:hover .drop-icon { opacity: 0.6; transform: scale(1.1); }

  .drop-label {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }

  .drop-label span {
    display: block;
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.6;
  }

  .preview-img {
    max-width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 1px;
    display: none;
  }

  /* ─── Action Bar ─── */
  .action-bar {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    flex: 1;
    justify-content: center;
    min-width: 140px;
    user-select: none;
  }

  .btn:hover {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(245,166,35,0.06);
  }

  .btn:active { transform: scale(0.98); }

  .btn.primary {
    border-color: var(--amber);
    color: var(--amber);
  }

  .btn.success {
    border-color: var(--green);
    color: var(--green);
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-icon { font-size: 16px; }

  /* ─── Info Panel ─── */
  .info-panel {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 16px 20px;
    display: none;
  }

  .info-panel.visible { display: block; }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }

  .info-item label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  .info-item span {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--amber2);
  }

  /* ─── Log ─── */
  .log-section {
    margin-top: 24px;
  }

  .log-header {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .log-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .log-box {
    background: #080a0d;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    min-height: 80px;
    max-height: 160px;
    overflow-y: auto;
  }

  .log-line { display: block; }
  .log-line.ok   { color: var(--green); }
  .log-line.info { color: var(--amber); }
  .log-line.err  { color: var(--red); }
  .log-line .ts  { color: var(--muted); margin-right: 10px; }

  /* Scrollbar */
  .log-box::-webkit-scrollbar { width: 4px; }
  .log-box::-webkit-scrollbar-track { background: transparent; }
  .log-box::-webkit-scrollbar-thumb { background: var(--border); }

  /* ─── Hotkey hints ─── */
  .hints {
    margin-top: 12px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .key {
    display: inline-block;
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 3px;
    color: var(--text);
    font-size: 11px;
    background: var(--panel);
  }

  #file-input { display: none; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px; right: 32px;
    background: var(--panel);
    border: 1px solid var(--amber);
    color: var(--amber);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 12px 20px;
    border-radius: 2px;
    z-index: 100;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

</style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo-dot"></div>
    <div class="header-text">
      <h1>IMG.PORTAL</h1>
      <p>IMAGE TRANSFER SYSTEM v1.0</p>
    </div>
    <div class="status-badge">● ONLINE</div>
  </header>

  <!-- Drop / Paste Zone -->
  <div class="drop-zone" id="dropZone" title="클릭하여 파일 선택">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="drop-icon" id="dropIcon">⬡</div>
    <div class="drop-label" id="dropLabel">
      이미지를 드래그하거나 클릭하여 업로드<br>
      또는 <strong style="color:var(--amber)">Ctrl+V</strong>로 클립보드에서 붙여넣기
      <span>JPG · PNG · GIF · WEBP · BMP 지원</span>
    </div>
    <img class="preview-img" id="previewImg" alt="미리보기">
  </div>

  <!-- Action Buttons -->
  <div class="action-bar">
    <button class="btn primary" id="btnUpload">
      <span class="btn-icon">📁</span> 파일 업로드
    </button>
    <button class="btn" id="btnPaste">
      <span class="btn-icon">📋</span> 클립보드 붙여넣기
    </button>
    <button class="btn success" id="btnDownload" disabled>
      <span class="btn-icon">⬇</span> 이미지 다운로드
    </button>
    <button class="btn" id="btnClear" disabled>
      <span class="btn-icon">✕</span> 초기화
    </button>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <!-- Image Info -->
  <div class="info-panel" id="infoPanel">
    <div class="info-grid">
      <div class="info-item">
        <label>파일명</label>
        <span id="infoName">—</span>
      </div>
      <div class="info-item">
        <label>해상도</label>
        <span id="infoDim">—</span>
      </div>
      <div class="info-item">
        <label>파일 크기</label>
        <span id="infoSize">—</span>
      </div>
      <div class="info-item">
        <label>형식</label>
        <span id="infoType">—</span>
      </div>
    </div>
  </div>

  <!-- Hotkeys -->
  <div class="hints">
    <div class="hint"><span class="key">Ctrl</span>+<span class="key">V</span> 붙여넣기</div>
    <div class="hint"><span class="key">Ctrl</span>+<span class="key">S</span> 다운로드</div>
    <div class="hint"><span class="key">ESC</span> 초기화</div>
  </div>

  <!-- Log -->
  <div class="log-section" style="margin-top:28px">
    <div class="log-header">System Log</div>
    <div class="log-box" id="logBox"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const dropZone   = document.getElementById('dropZone');
  const previewImg = document.getElementById('previewImg');
  const dropIcon   = document.getElementById('dropIcon');
  const dropLabel  = document.getElementById('dropLabel');
  const fileInput  = document.getElementById('file-input');
  const btnUpload  = document.getElementById('btnUpload');
  const btnPaste   = document.getElementById('btnPaste');
  const btnDownload= document.getElementById('btnDownload');
  const btnClear   = document.getElementById('btnClear');
  const infoPanel  = document.getElementById('infoPanel');
  const logBox     = document.getElementById('logBox');
  const toast      = document.getElementById('toast');

  let currentFile = null;
  let currentBlob = null;
  let currentName = 'image.png';

  /* ── Logger ── */
  function log(msg, type='info') {
    const now = new Date();
    const ts = now.toTimeString().slice(0,8);
    const line = document.createElement('span');
    line.className = `log-line ${type}`;
    line.innerHTML = `<span class="ts">[${ts}]</span>${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /* ── Show Image ── */
  function loadImage(src, name, size, type) {
    previewImg.src = src;
    previewImg.style.display = 'block';
    dropIcon.style.display = 'none';
    dropLabel.style.display = 'none';
    dropZone.classList.add('has-image');

    btnDownload.disabled = false;
    btnClear.disabled    = false;

    currentName = name || 'image.png';

    previewImg.onload = () => {
      document.getElementById('infoName').textContent = currentName;
      document.getElementById('infoDim').textContent  = `${previewImg.naturalWidth} × ${previewImg.naturalHeight} px`;
      document.getElementById('infoSize').textContent = size ? formatSize(size) : '—';
      document.getElementById('infoType').textContent = type || '—';
      infoPanel.classList.add('visible');
    };
  }

  function formatSize(bytes) {
    if (bytes < 1024)       return bytes + ' B';
    if (bytes < 1048576)    return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(2) + ' MB';
  }

  /* ── Clear ── */
  function clearAll() {
    previewImg.src = '';
    previewImg.style.display = 'none';
    dropIcon.style.display   = 'block';
    dropLabel.style.display  = 'block';
    dropZone.classList.remove('has-image');
    infoPanel.classList.remove('visible');
    btnDownload.disabled = true;
    btnClear.disabled    = true;
    currentBlob = null;
    currentFile = null;
    fileInput.value = '';
    log('시스템 초기화 완료.', 'info');
  }

  /* ── File Reader Helper ── */
  function readFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      log('이미지 파일만 지원됩니다.', 'err');
      showToast('⚠ 이미지 파일이 아닙니다');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      currentBlob = e.target.result;
      loadImage(e.target.result, file.name, file.size, file.type.toUpperCase().replace('IMAGE/',''));
      log(`파일 로드 성공 → ${file.name} (${formatSize(file.size)})`, 'ok');
      showToast('✓ 이미지 로드 완료');
    };
    reader.readAsDataURL(file);
  }

  /* ── 1. Upload ── */
  btnUpload.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('click', () => {
    if (!previewImg.style.display || previewImg.style.display === 'none') fileInput.click();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) { log(`파일 선택됨: ${file.name}`, 'info'); readFile(file); }
  });

  /* ── 2. Paste (Ctrl+V) ── */
  async function pasteFromClipboard() {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const imgType = item.types.find(t => t.startsWith('image/'));
        if (imgType) {
          const blob = await item.getType(imgType);
          const file = new File([blob], 'clipboard.png', { type: imgType });
          log('클립보드에서 이미지 감지됨.', 'info');
          readFile(file);
          return;
        }
      }
      log('클립보드에 이미지가 없습니다.', 'err');
      showToast('⚠ 클립보드에 이미지 없음');
    } catch {
      log('클립보드 접근 실패 — Ctrl+V 키를 직접 사용하세요.', 'err');
      showToast('⚠ 클립보드 접근 권한이 필요합니다');
    }
  }

  btnPaste.addEventListener('click', pasteFromClipboard);

  document.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        log('Ctrl+V 붙여넣기 감지됨.', 'info');
        readFile(file);
        e.preventDefault();
        return;
      }
    }
    log('붙여넣은 데이터에 이미지가 없습니다.', 'err');
  });

  /* ── 3. Download ── */
  function downloadImage() {
    if (!currentBlob) return;
    const ext  = currentName.includes('.') ? '' : '.png';
    const name = currentName + ext;
    const a    = document.createElement('a');
    a.href     = currentBlob;
    a.download = name;
    a.click();
    log(`다운로드 시작 → ${name}`, 'ok');
    showToast('⬇ 다운로드 시작');
  }

  btnDownload.addEventListener('click', downloadImage);
  btnClear.addEventListener('click', clearAll);

  /* ── Drag & Drop ── */
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) { log(`드래그 드롭: ${file.name}`, 'info'); readFile(file); }
  });

  /* ── Keyboard Shortcuts ── */
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      if (!btnDownload.disabled) downloadImage();
    }
    if (e.key === 'Escape') clearAll();
  });

  /* ── Boot log ── */
  log('IMG.PORTAL 시스템 초기화...', 'info');
  setTimeout(() => log('파일 업로드 모듈 준비 완료.', 'ok'), 400);
  setTimeout(() => log('클립보드 수신 모듈 준비 완료.', 'ok'), 700);
  setTimeout(() => log('다운로드 모듈 준비 완료.', 'ok'), 1000);
  setTimeout(() => log('모든 모듈 온라인. 이미지를 로드하세요.', 'ok'), 1300);
</script>
</body>
</html>
