<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장지휘관 무전 훈련</title>

<style>
body {
  font-family: 'Malgun Gothic', sans-serif;
  text-align: center;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  font-size: 24px;
  margin-bottom: 20px;
}

button {
  width: 90%;
  max-width: 320px;
  font-size: 20px;
  padding: 15px;
  margin: 10px auto;
  border: none;
  border-radius: 12px;
  display: block;
}

#startBtn { background: #00c853; color: white; }
#stopBtn { background: #d50000; color: white; }

#status {
  margin-top: 10px;
  font-size: 14px;
  color: #bbb;
}

#result {
  margin-top: 20px;
  font-size: 18px;
  background: #222;
  padding: 15px;
  border-radius: 10px;
  min-height: 120px;
  line-height: 1.5;
}
</style>
</head>

<body>

<h1>🚒 현장지휘관 무전 훈련</h1>

<button id="startBtn">🎙️ 녹음 시작</button>
<button id="stopBtn">⏹️ 녹음 중지</button>

<div id="status">상태: 대기 중</div>
<div id="result">음성 인식 결과가 여기에 표시됩니다.</div>

<script>
const resultDiv = document.getElementById("result");
const statusDiv = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let recognition = null;

// 음성 인식 객체 생성
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusDiv.innerText = "❌ 이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome 권장)";
    return null;
  }

  const recog = new SpeechRecognition();
  recog.lang = "ko-KR";
  recog.interimResults = true;
  recog.continuous = true;
  recog.maxAlternatives = 1;

  // 상태 표시
  recog.onstart = () => {
    statusDiv.innerText = "🟢 녹음 중...";
  };

  recog.onend = () => {
    statusDiv.innerText = "⏹️ 중지됨";
  };

  recog.onerror = (event) => {
    statusDiv.innerText = "⚠️ 오류: " + event.error;
  };

  // 🔥 핵심 수정 (중복 제거 로직)
  recog.onresult = (event) => {
    let finalTranscript = "";
    let interimTranscript = "";

    for (let i = 0; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalTranscript += transcript + " ";
      } else {
        interimTranscript += transcript;
      }
    }

    resultDiv.innerHTML =
      finalTranscript +
      "<span style='color:gray'>" + interimTranscript + "</span>";
  };

  return recog;
}

recognition = initRecognition();

// 녹음 시작
startBtn.onclick = () => {
  if (!recognition) return;

  resultDiv.innerHTML = ""; // 초기화

  try {
    recognition.start();
  } catch (e) {
    statusDiv.innerText = "⚠️ 이미 실행 중이거나 권한 문제 발생";
  }
};

// 녹음 중지
stopBtn.onclick = () => {
  if (!recognition) return;

  recognition.stop();
};
</script>

</body>
</html>
