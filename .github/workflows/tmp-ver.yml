name: tmp ver
on:
  push:
    paths: ['.github/workflows/tmp-ver.yml']
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do curl -s -m 20 -H 'X-SACHIL: 1' https://app.sachil47.com/api/me | python3 -c "import sys,json;print('server',json.load(sys.stdin).get('version'))" || echo no; sleep 20; done
          curl -s -m 30 -G -H 'X-SACHIL: 1' --data-urlencode "q=키인포" https://app.sachil47.com/api/search | python3 -c "import sys,json;st=json.load(sys.stdin).get('status') or {};print('prog' in st, st.get('files'), st.get('pages'))"
