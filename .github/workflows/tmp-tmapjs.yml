name: tmp tmapjs
on:
  push:
    paths: ['.github/workflows/tmp-tmapjs.yml']
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://topopentile1.tmap.co.kr/scriptSDKV2/tmapjs2.min.js https://topopentile2.tmap.co.kr/scriptSDKV2/tmapjs2.min.js https://topopentile1.tmap.co.kr/scriptSDKV2/tmapjs2.min.js?version=20231206; do
            echo "== $u"; curl -s -m 60 "$u" -o m.js; wc -c m.js; head -c 200 m.js; echo
            grep -o '.\{300\}iconSize.\{300\}' m.js | head -6
            echo ---- offset; grep -o '.\{200\}\.offset.\{200\}' m.js | head -6
            [ -s m.js ] && break; done
