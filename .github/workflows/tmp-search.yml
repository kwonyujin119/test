name: tmp search check
on:
  push:
    paths: ['.github/workflows/tmp-search.yml']
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in 사고대비물질 키인포 유해물질; do
            echo "== q=$q"
            curl -s -m 30 -G -H 'X-SACHIL: 1' --data-urlencode "q=$q" https://app.sachil47.com/api/search | python3 -c "
          import sys,json
          j=json.load(sys.stdin); st=j.get('status') or {}
          print('status: files',st.get('files'),'pages',st.get('pages'),'pending',st.get('pending'),'busy',st.get('busy'))
          print('failed:',[(f.get('name'),f.get('why')) for f in st.get('failed') or []])
          for h in (j.get('hits') or [])[:5]: print(' hit:',h.get('slug'),h.get('name'),h.get('page'))"
          done
          echo "== version"; curl -s -m 20 -H 'X-SACHIL: 1' https://app.sachil47.com/api/me | python3 -c "import sys,json;print(json.load(sys.stdin).get('version'))"
