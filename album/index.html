<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>유진·아름 사진 저장소</title>
<meta name="description" content="유진·아름 둘만의 사진 저장소 — 암호로 들어가 사진을 올리고 봅니다. 사진은 PC 서버에만 저장됩니다.">
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta name="theme-color" content="#0B1B3F">
<link rel="icon" href="icons/icon-192.png?v=1" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="유진·아름 사진">
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light;--navy:#0B1B3F;--navy-2:#13285A;--ocean:#244EA2;--ocean-soft:#EAF0FA;--yellow:#FDD000;--yellow-soft:#FFF4B8;
  --bg:#F3F4F6;--card:#fff;--line:#E2E5EA;--ink:#0B1B3F;--muted:#5F6672;--danger:#D92D20;--ok:#067647;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit}
[hidden]{display:none!important}
.screen{min-height:100%}
/* ---------- 로그인 ---------- */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:calc(24px + var(--sat)) 20px calc(24px + var(--sab));background:linear-gradient(180deg,var(--navy) 0 46%,var(--bg) 46%)}
.lcard{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:26px 22px 22px;box-shadow:0 18px 50px rgba(11,27,63,.25)}
.logo{display:grid;place-items:center;width:84px;height:84px;margin:-70px auto 12px;border-radius:24px;background:var(--navy);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.logo img{width:84px;height:84px;border-radius:24px}
h1{margin:0;text-align:center;font-size:21px;letter-spacing:-.2px}
.sub{margin:6px 0 20px;text-align:center;color:var(--muted);font-size:13px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.who button{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700;font-size:16px}
.who button .av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ocean-soft);color:var(--ocean);font-weight:800}
.who button[aria-pressed=true]{border-color:var(--navy);background:var(--yellow-soft)}
.who button[aria-pressed=true] .av{background:var(--navy);color:var(--yellow)}
.field{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:0 6px 0 14px;background:#fff}
.field:focus-within{border-color:var(--ocean)}
.field input{flex:1;min-width:0;border:0;outline:0;padding:13px 0;font-size:17px;letter-spacing:2px;background:transparent}
.field button{padding:8px 10px;color:var(--muted);font-size:13px}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:16px}
.btn:disabled{opacity:.6}
.msg{min-height:20px;margin:10px 2px 0;font-size:13px;color:var(--danger);text-align:center}
.msg.ok{color:var(--ok)}
.tiny{margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
.tiny button{color:var(--ocean);text-decoration:underline}
/* ---------- 메인 ---------- */
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 12px 0}
.hrow{display:flex;align-items:center;gap:8px;height:48px}
.hrow .ttl{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .ttl small{display:block;font-weight:500;font-size:12px;color:#C9D3EA}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff}
.ib:active{background:rgba(255,255,255,.12)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;padding:8px 0 10px}
.chips button{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px}
.chips button[aria-pressed=true]{background:var(--yellow);color:var(--navy)}
main{padding:6px 6px calc(96px + var(--sab))}
.month{position:sticky;top:var(--hh,106px);z-index:2;margin:10px 4px 6px;display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(243,244,246,.92);backdrop-filter:blur(6px);font-weight:800;font-size:15px}
.month small{font-weight:500;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(6,1fr)}main{padding-left:12px;padding-right:12px}}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:#DDE2EA;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .w{position:absolute;left:5px;bottom:5px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;color:var(--navy);background:var(--yellow);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tile .w.a{background:#fff;color:var(--ocean)}
.tile .m{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--ocean)}
.empty{margin:60px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:6px;color:var(--ink);font-size:17px}
#fab{position:fixed;right:18px;bottom:calc(20px + var(--sab));z-index:6;display:grid;place-items:center;width:60px;height:60px;border-radius:20px;background:var(--yellow);color:var(--navy);box-shadow:0 10px 26px rgba(11,27,63,.35)}
#fab svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
#upbar{position:fixed;left:12px;right:90px;bottom:calc(22px + var(--sab));z-index:6;padding:10px 12px;border-radius:14px;background:var(--navy);color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#upbar .bar{height:4px;margin-top:7px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
#upbar .bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .2s}
#upbar .row{display:flex;justify-content:space-between;gap:8px}
#upbar .row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upbar button{color:#C9D3EA;text-decoration:underline;white-space:nowrap}
/* ---------- 시트·대화상자 ---------- */
.dim{position:fixed;inset:0;z-index:20;background:rgba(6,8,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:10px 14px calc(14px + var(--sab))}
.sheet .grab{width:40px;height:4px;margin:0 auto 8px;border-radius:2px;background:#D5D9E0}
.sheet h3{margin:6px 6px 10px;font-size:15px;color:var(--muted);font-weight:600}
.sheet .it{display:flex;align-items:center;gap:12px;width:100%;padding:13px 10px;border-radius:12px;text-align:left;font-size:16px}
.sheet .it:active{background:var(--bg)}
.sheet .it svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ocean);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet .it.red,.sheet .it.red svg{color:var(--danger);stroke:var(--danger)}
.sheet .it small{display:block;color:var(--muted);font-size:12px}
.sheet .cancel{width:100%;margin-top:6px;padding:13px;border-radius:12px;background:var(--bg);font-weight:700}
.dlg{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(6,8,14,.5)}
.dlg .box{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:18px}
.dlg h3{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:13px;white-space:pre-line}
.dlg textarea,.dlg input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;outline:0;background:#fff}
.dlg textarea{min-height:90px;resize:vertical}
.dlg textarea:focus,.dlg input:focus{border-color:var(--ocean)}
.dlg .acts{display:flex;gap:8px;margin-top:12px}
.dlg .acts button{flex:1;padding:12px;border-radius:12px;background:var(--bg);font-weight:700}
.dlg .acts .pri{background:var(--navy);color:var(--yellow)}
.dlg .acts .red{background:#FEE4E2;color:var(--danger)}
/* ---------- 뷰어 ---------- */
#viewer{position:fixed;inset:0;z-index:15;background:#06080E;color:#fff;display:flex;flex-direction:column;touch-action:pan-y}
.vtop{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(6px + var(--sat)) 8px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);transition:opacity .2s}
.vtop .vm{flex:1;min-width:0;text-align:center;font-size:13px;line-height:1.3}
.vtop .vm b{display:block;font-size:14px}
.vtop .vm span{color:#C9D3EA}
.vstage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.vstage img{max-width:100%;max-height:100%;object-fit:contain;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none}
.vstage img.full{opacity:0;transition:opacity .15s}
.vstage img.full.on{opacity:1}
.vstage.sw{transition:transform .18s}
.vbot{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 10px calc(10px + var(--sab));background:linear-gradient(transparent,rgba(0,0,0,.7));transition:opacity .2s}
.vmemo{min-height:20px;margin:0 8px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.vmemo:empty::before{content:'메모 없음 — 아래 메모 버튼으로 남기기';color:#8B96AE;font-size:13px}
.vbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.vbtns button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;font-size:12px;color:#fff}
.vbtns button:active{background:rgba(255,255,255,.1)}
.vbtns svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtns .red{color:#FDA29B}
#viewer.hide .vtop,#viewer.hide .vbot{opacity:0;pointer-events:none}
.varr{position:absolute;top:50%;z-index:2;display:none;place-items:center;width:52px;height:52px;margin-top:-26px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff}
.varr svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.varr.p{left:14px}.varr.n{right:14px}
@media(hover:hover) and (min-width:700px){.varr{display:grid}#viewer.hide .varr{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));z-index:40;transform:translateX(-50%);max-width:88vw;padding:10px 16px;border-radius:12px;background:rgba(11,27,63,.95);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login" class="screen">
  <div class="lcard">
    <div class="logo"><img src="icons/icon-192.png?v=1" alt=""></div>
    <h1>유진 · 아름 사진 저장소</h1>
    <p class="sub">둘만 보는 곳이에요. 사진은 PC 서버에만 저장돼요.</p>
    <div class="who" id="whoPick">
      <button type="button" data-who="유진" aria-pressed="false"><span class="av">유</span>유진</button>
      <button type="button" data-who="아름" aria-pressed="false"><span class="av">아</span>아름</button>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <input id="code" type="password" inputmode="text" placeholder="암호" autocomplete="current-password" enterkeyhint="go">
        <button type="button" id="eye">보기</button>
      </div>
      <button class="btn" id="goBtn" type="submit">들어가기</button>
    </form>
    <div class="msg" id="lmsg"></div>
    <div class="tiny" id="srvInfo"></div>
  </div>
</div>

<!-- 메인 -->
<div id="main" class="screen" hidden>
  <header>
    <div class="hrow">
      <div class="ttl">유진 · 아름 사진 저장소<small id="hsub">불러오는 중…</small></div>
      <button class="ib" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      <button class="ib" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>
    </div>
    <div class="chips" id="chips">
      <button data-f="all" aria-pressed="true">전체</button>
      <button data-f="유진" aria-pressed="false">유진</button>
      <button data-f="아름" aria-pressed="false">아름</button>
    </div>
  </header>
  <main id="grid"></main>
  <div id="upbar" hidden>
    <div class="row"><b id="upTxt"></b><button type="button" id="upCancel">그만</button></div>
    <div class="bar"><i id="upFill"></i></div>
  </div>
  <button id="fab" aria-label="사진 올리기"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- 뷰어 -->
<div id="viewer" hidden>
  <div class="vstage" id="vstage"><img class="th" id="vth" alt=""><img class="full" id="vfull" alt=""></div>
  <div class="vtop">
    <button class="ib" id="vClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="vm" id="vmeta"></div>
    <div style="width:40px"></div>
  </div>
  <button class="varr p" id="vPrev" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="varr n" id="vNext" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="vbot">
    <div class="vmemo" id="vmemo"></div>
    <div class="vbtns">
      <button id="vMemo"><svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>메모</button>
      <button id="vSave"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>저장</button>
      <button id="vShare"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>공유</button>
      <button id="vDel" class="red"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>삭제</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
(() => {
'use strict';
const VER = 'v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} },
             del: k => { try { localStorage.removeItem(k); } catch (_) {} } };
const DEF_SRV = 'https://app.sachil47.com';
const qsSrv = new URLSearchParams(location.search).get('srv');
let SRV = (qsSrv || LS.get('album.srv') || DEF_SRV).replace(/\/+$/, '');
if (qsSrv) LS.set('album.srv', SRV);
let TOKEN = LS.get('album.token') || '', ME = null, PHOTOS = [], FILTER = 'all', USAGE = null, lastLoad = 0;
let who = LS.get('album.who') || '';

// ---------- 서버 호출
async function api(path, { method = 'GET', body = null, json = null, timeout = 30000 } = {}) {
  const h = { 'X-SACHIL': '1' };
  if (TOKEN) h.Authorization = 'Bearer ' + TOKEN;
  if (json) { h['Content-Type'] = 'application/json'; body = JSON.stringify(json); }
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  let r;
  try { r = await fetch(SRV + path, { method, headers: h, body, signal: ctl.signal, cache: 'no-store' }); }
  catch (e) { clearTimeout(t); throw new Error('서버에 연결할 수 없어요. PC 서버가 켜져 있는지 확인해 주세요'); }
  clearTimeout(t);
  let j = null; try { j = await r.json(); } catch (_) {}
  if (r.status === 401 && TOKEN && path !== '/api/album/login') { logoutLocal(); throw new Error('다시 로그인해 주세요'); }
  if (!r.ok || !(j && j.ok)) throw new Error((j && j.error) || ('오류 ' + r.status));
  return j;
}
function xhrUpload(url, blob, onProgress) {
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.setRequestHeader('X-SACHIL', '1');
    x.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
    x.timeout = 600000;
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let j = null; try { j = JSON.parse(x.responseText); } catch (_) {}
      if (x.status === 401) { logoutLocal(); return no(new Error('다시 로그인해 주세요')); }
      if (x.status >= 200 && x.status < 300 && j && j.ok) ok(j); else no(new Error((j && j.error) || ('오류 ' + x.status)));
    };
    x.onerror = () => no(new Error('전송 실패(연결이 끊겼어요)'));
    x.ontimeout = () => no(new Error('전송 시간이 너무 오래 걸려 멈췄어요'));
    x.send(blob);
    upXhr = x;
  });
}
const thumbUrl = id => `${SRV}/api/album/thumb/${id}?t=${encodeURIComponent(TOKEN)}`;
const fileUrl = (id, dl) => `${SRV}/api/album/file/${id}?t=${encodeURIComponent(TOKEN)}${dl ? '&dl=1' : ''}`;

// ---------- 화면 도우미
let toastT = 0;
function toast(msg, ms = 2400) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms); }
const fmtMB = b => b >= 1024 * 1024 * 1024 ? (b / 1073741824).toFixed(2) + 'GB' : b >= 1024 * 1024 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB';
const dateOf = p => new Date((p.taken || p.ts) * 1000);
const fmtDate = d => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${['일','월','화','수','목','금','토'][d.getDay()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const monthKey = d => `${d.getFullYear()}년 ${d.getMonth() + 1}월`;

// 뒤로 버튼으로 창 닫기: 창을 열 때 기록 한 칸을 쌓고, 뒤로(popstate)가 오면 맨 위 창을 닫는다
const STACK = []; let skipPop = 0;
function pushLayer(close) { STACK.push(close); history.pushState({ album: STACK.length }, ''); }
function closeTop() {   // 화면에서 닫기: 기록 한 칸을 되돌리되(popstate) 그 신호로 또 닫지 않게
  const c = STACK.pop(); if (!c) return;
  skipPop++; setTimeout(() => { skipPop = 0; }, 800);
  try { history.back(); } catch (_) {}
  c();
}
window.addEventListener('popstate', () => { if (skipPop > 0) { skipPop--; return; } const c = STACK.pop(); if (c) c(); });

function sheet(title, items) {
  return new Promise(res => {
    const dim = document.createElement('div'); dim.className = 'dim';

async function exifTaken(file) {

        const ascii = e => { const cnt = g32(e + 4); const p = cnt > 4 ? t + g32(e + 8) : e + 8; let s = ''; for (let i = 0; i < cnt - 1 && p + i < d.byteLength; i++) s += String.fromCharCode(d.getUint8(p + i)); return s; };

        if (!s) { const e3 = find(ifd0, 0x0132); if (e3) s = ascii(e3); }
        const m = /^(\d{4}):(\d\d):(\d\d)[ T](\d\d):(\d\d):(\d\d)/.exec(s);
        if (m) { const ts = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime(); return ts > 0 ? ts : 0; }
        return 0;
      }
      if (mk === 0xFFDA) break;
      off += 2 + len;
    }
  } catch (_) {}
  return 0;
}

  let sx = 0, sy = 0, dx = 0, on = false, multi = false; const st = $('#vstage');
  st.addEventListener('touchstart', e => { multi = e.touches.length > 1; if (multi) { on = false; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; on = true; st.classList.remove('sw'); }, { passive: true });
  st.addEventListener('touchmove', e => { if (!on || e.touches.length > 1) { on = false; st.style.transform = ''; return; } dx = e.touches[0].clientX - sx; const dy = e.touches[0].clientY - sy; if (Math.abs(dy) > Math.abs(dx) * 1.3) { on = false; st.style.transform = ''; return; } const edge = (dx > 0 && vIdx === 0) || (dx < 0 && vIdx === vList.length - 1); st.style.transform = `translateX(${edge ? dx / 3 : dx}px)`; }, { passive: true });
  st.addEventListener('touchend', () => { if (!on) return; on = false; st.classList.add('sw'); st.style.transform = ''; if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1); });
}
$('#vMemo').addEventListener('click', async () => {
  const p = cur(); if (!p) return;
  const v = await dialog({ title: '메모', text: `${p.who} · ${fmtDate(dateOf(p))}`, value: p.memo || '', multiline: true, placeholder: '이 사진에 남길 말' });
  if (v === null) return;
  try { const j = await api(`/api/album/photos/${p.id}`, { method: 'POST', json: { memo: v } }); Object.assign(p, j.photo); showCur(); render(); toast('메모를 저장했어요', 1400); }
  catch (err) { toast(err.message); }
});
async function fetchBlob(p) {
  const r = await fetch(fileUrl(p.id));
  if (!r.ok) throw new Error('사진을 받지 못했어요');
  const b = await r.blob();
  return new File([b], p.name || ('photo' + (p.mime === 'image/png' ? '.png' : p.mime === 'image/webp' ? '.webp' : p.mime === 'image/gif' ? '.gif' : '.jpg')), { type: p.mime || b.type });
}
$('#vSave').addEventListener('click', async () => {
  const p = cur(); if (!p) return;
  toast('원본을 받는 중…', 1500);
  try {
    const f = await fetchBlob(p);
    if (navigator.canShare && navigator.canShare({ files: [f] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [f] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const u = URL.createObjectURL(f); const a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
    toast('내려받기를 시작했어요', 1600);
  } catch (err) { toast(err.message); }
});
$('#vShare').addEventListener('click', async () => {
  const p = cur(); if (!p) return;
  if (!navigator.share) { toast('이 브라우저는 공유를 지원하지 않아요. 저장 버튼을 써 주세요'); return; }
  toast('원본을 받는 중…', 1500);
  try {
    const f = await fetchBlob(p);
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: p.memo || '사진' });
    else toast('이 브라우저는 사진 공유를 지원하지 않아요. 저장 버튼을 써 주세요');
  } catch (err) { if (!(err && err.name === 'AbortError')) toast(err.message); }
});
$('#vDel').addEventListener('click', async () => {
  const p = cur(); if (!p) return;
  const ok = await dialog({ title: '이 사진을 지울까요?', text: `${p.who}이(가) 올린 사진 · ${fmtDate(dateOf(p))}\n지우면 서버에서도 사라져요(되돌릴 수 없음).`, noInput: true, okText: '지우기', danger: true });
  if (!ok) return;
  try {
    const j = await api(`/api/album/photos/${p.id}`, { method: 'DELETE' });
    PHOTOS = PHOTOS.filter(x => x.id !== p.id); USAGE = j; paintHead(); render();
    vList = visible(); if (vIdx >= vList.length) vIdx = vList.length - 1;
    if (vIdx < 0) closeViewer(); else showCur();
    toast('지웠어요', 1400);
  } catch (err) { toast(err.message); }
});

// ---------- 시작
function measureHead() { const h = document.querySelector('header'); if (h && !$('#main').hidden) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
window.addEventListener('resize', measureHead);
paintWho();
if (TOKEN) enter().catch(() => showLogin()); else showLogin();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
})();
</script>
